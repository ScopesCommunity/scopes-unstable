name: Scopes Nightly
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"
jobs:
  linux:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt update && sudo apt install mkdocs python3-pip libtinfo6 fish gcc-15
      - run: df -h
      - name: "disk-cleanup"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a
      - run: df -h
      - name: Prepare build
        run: |
          git clone https://git.sr.ht/~duangle/scopes/ --depth 1
      - id: build
        name: Build
        working-directory: ./scopes
        run: |
          fish ../build.fish linux main
      - name: Artifact (main)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact-name-main }}
          path: scopes/${{ steps.build.outputs.artifact-name-main }}.tar.gz
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
      - name: Install build dependencies
        run: pacman -S --noconfirm git make mingw64/mingw-w64-x86_64-python mingw64/mingw-w64-x86_64-python-pip zip unzip mingw64/mingw-w64-x86_64-gcc mingw64/mingw-w64-x86_64-libxml2 fish mercurial
      - name: Prepare build
        run: |
          git clone https://git.sr.ht/~duangle/scopes/ --depth 1
      - id: build
        name: Build
        working-directory: ./scopes
        
        run: |
          fish ../build.fish windows default
      - name: Artifact (default)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact-name-default }}
          path: scopes/${{ steps.build.outputs.artifact-name-default }}.zip
